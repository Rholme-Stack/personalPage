<h1>Login page</h1>

<div class="container mt-5">
    <div *ngIf="(user$ | async) as user; else authForm">
      <h3>Bienvenido, {{ user.email }}</h3>
      <button class="btn btn-danger mt-3" (click)="logout()">Cerrar Sesión</button>
    </div>
  
    <ng-template #authForm>
      <h2>Iniciar Sesión</h2>
  
      <form (ngSubmit)="login()" class="mt-3">
        <div class="mb-3">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Contraseña</label>
          <input type="password" [(ngModel)]="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
  
      <hr>
  
      <!-- <form (ngSubmit)="register()">
        <h4>¿No tienes cuenta? Regístrate</h4>
        <button type="submit" class="btn btn-success">Crear Cuenta</button>
      </form> -->
  
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
    </ng-template>
  </div>
