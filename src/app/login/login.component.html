<div class="container mt-5">
  <!-- ✅ Si el usuario está autenticado, muestra su email y botón de logout -->
  <div *ngIf="(user$ | async) as user; else authForm">
    <h3>Bienvenido, {{ user.email }}</h3>
    <button class="btn btn-danger mt-3" (click)="logout()">Cerrar Sesión</button>
  </div>

  <!-- ✅ Formulario de Login si NO hay usuario autenticado -->
  <ng-template #authForm>
    <h2>New session</h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="p-4 border rounded">
    
      <!-- ✅ Campo Email -->
      <div class="mb-3">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" name="email" class="form-control"
          [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
        <small class="text-danger" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          {{ 'REQUIRED_EMAIL' | translate }}
        </small>
      </div>

      <!-- ✅ Campo Contraseña -->
      <div class="mb-3">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" name="password" class="form-control"
          [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
        <small class="text-danger" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          {{ 'INVALID_PASSWORD' | translate }}
        </small>
      </div>

      <!-- ✅ Botón de Enviar Deshabilitado si el Formulario es Inválido -->
      <button type="submit" class="btn" [disabled]="loginForm.invalid">Login</button>

      <!-- ✅ Mensaje de Error de Firebase -->
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>
    </form>

    <hr>

    <!-- <form (ngSubmit)="register()">
      <h4>¿No tienes cuenta? Regístrate</h4>
      <button type="submit" class="btn btn-success">Crear Cuenta</button>
    </form> -->

  </ng-template>
</div>
