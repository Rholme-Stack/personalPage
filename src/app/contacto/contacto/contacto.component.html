<div class="d-flex flex-column align-items-center full-height">
<div class="elemento1">
    <img class="image" src="imagenes/contact.webp" alt="Not Found">
</div>
<div class="container mt-5">
  <h2 class="text-center">{{'CONTACT_FORM' | translate}}</h2>
  <form [formGroup]="contactForm" (ngSubmit)="submitForm()" class="p-4 border rounded">
    
    <div class="mb-3">
      <label for="name" class="form-label">{{'NAME' | translate}}</label>
      <input type="text" id="name" class="form-control bg-dark text-white" formControlName="name">
      <small class="text-danger" *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
        {{'REQUIRED_NAME' | translate}}
      </small>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">{{'EMAIL' | translate}}</label>
      <input type="email" id="email" class="form-control bg-dark text-white" formControlName="email">
      <small class="text-danger" *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
        {{'REQUIRED_EMAIL' | translate}}
      </small>
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">{{'MESSAGE' | translate}}</label>
      <textarea id="message" class="form-control bg-dark text-white" rows="4" formControlName="message"></textarea>
      <small class="text-danger" *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched">
        {{'REQUIRED_MESSAGE' | translate}}
      </small>
    </div>

    <button 
  type="submit" 
  class="btn btn-custom"
  [disabled]="contactForm.invalid"
  [ngClass]="{'btn-disabled': contactForm.invalid, 'btn-active': !contactForm.invalid}">
  {{ 'SUBMIT' | translate }}
</button>
  </form>
</div>

<!-- Modal Reutilizable -->
<app-message
  #modalConfirmacion
  [titulo]="'MODAL_INFO_TITLE' | translate"
  [mensaje]="'MODAL_INFO_MESSAGE' | translate"
  modalId="modalContacto">
</app-message>

</div>
