<h1 class="text-center mb-4">Lista de mensajes</h1>

<div class="container">
  <div class="row">
    <div class="col-md-6 col-lg-4 mb-3" *ngFor="let message of messages">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ message.name }}</h5>
          <h6 class="card-subtitle text-muted">{{ message.email }}</h6>
          <p class="card-text">
            <strong>Estado:</strong> 
            <span [ngClass]="message.status === 'new' ? 'text-success' : 'text-danger'">
              {{ message.status }}
            </span>
          </p>
          <p class="card-text"><strong>Fecha:</strong> {{ message.timestamp.toMillis() | date:'dd/MM/yyyy h:mm:ss a' }}</p>
          <p class="card-text"><strong>Mensaje:</strong> {{ message.message }}</p>
          
          <!-- Botones de acción -->
          <div class="d-flex justify-content-end">
            <button class="btn btn-danger btn-sm me-2" (click)="deleteMessage(message.id!)">
              <i class="fas fa-trash-alt"></i>
            </button>
            <button class="btn btn-success btn-sm" (click)="updateStatus(message.id!)">
              <i class="fas fa-check-circle"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
